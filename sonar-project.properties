# sonar-project.properties — Sprint 12 Slice 8.
#
# Skeleton config so an operator can flip on a SonarQube /
# SonarCloud project against this repo without authoring it from
# scratch. Live integration is deferred (needs a Sonar instance);
# the CI step in .github/workflows/ci.yml uses `if: false` until
# a SONAR_TOKEN secret is provisioned.

sonar.projectKey=guildford-vue
sonar.organization=guildford-vue
sonar.projectName=Guildford Vue
sonar.projectVersion=0.1.0
sonar.sourceEncoding=UTF-8

sonar.sources=lib
sonar.tests=test

# ExCoveralls output drives Sonar's coverage indicator.
sonar.elixir.coverage.reportPaths=cover/excoveralls.json

# Exclude generated / vendor / 3rd-party.
sonar.exclusions=\
  deps/**/*,\
  _build/**/*,\
  priv/static/**/*,\
  priv/repo/migrations/**/*,\
  assets/node_modules/**/*

# Ignore some Sonar rules that don't fit Phoenix idioms:
#   - "Reusing a variable name" — Phoenix's `socket = assign(socket, …)` pipe is intentional.
sonar.issue.ignore.multicriteria=e1
sonar.issue.ignore.multicriteria.e1.ruleKey=elixir:S1481
sonar.issue.ignore.multicriteria.e1.resourceKey=lib/guildford_vue_web/live/**/*.ex
