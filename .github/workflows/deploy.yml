name: Deploy

# Deployment is INERT until the user provides FLY_API_TOKEN as a repo secret.
# Sprint 0 deliberately leaves this workflow disabled by `if: false` so a
# merge to main does NOT attempt to ship. Re-enable when ready.

on:
  push:
    branches: [main]

jobs:
  deploy:
    if: false  # change to `true` (or remove this line) when FLY_API_TOKEN is configured
    name: Fly.io blue-green deploy
    runs-on: ubuntu-latest
    needs: []
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Pre-deploy secret scan
        run: scripts/secret-scan.sh --pre-deploy

      # superfly/flyctl-actions has no semver tags — pin the master HEAD
      # SHA at the time of Sprint 11.5. Revisit when superfly publishes
      # a proper release. Dependabot will surface updates once registered.
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # master @ 2026-05-30

      - name: flyctl deploy
        run: flyctl deploy --remote-only --strategy bluegreen
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
