# docker-compose.yml — local development services for Guildford Vue.
#
# Bring up:    docker compose up -d
# Tear down:   docker compose down
# Wipe data:   docker compose down -v
#
# Services:
#   db          — PostgreSQL 16 + PostGIS 3.4 (exam_centres, slots, etc.)
#   mailcatcher — captures outgoing dev email; web UI at http://localhost:1080
#   minio       — S3-compatible object store for PDF receipts (console at :9001)
#   minio-init  — one-shot bucket creation
#
# Phoenix runs on the host (mix phx.server) and connects to these.

services:
  db:
    image: postgis/postgis:16-3.4
    container_name: guildford_vue_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: guildford_vue_dev
    ports:
      - "5434:5432"   # host 5434 → container 5432 (5432 & 5433 are held by the sftgen project on this host)
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d guildford_vue_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailcatcher:
    image: sj26/mailcatcher:v0.10.0
    container_name: guildford_vue_mailcatcher
    restart: unless-stopped
    ports:
      - "1025:1025"   # SMTP
      - "1080:1080"   # web UI

  minio:
    image: minio/minio:latest
    container_name: guildford_vue_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # web console
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:latest
    container_name: guildford_vue_minio_init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/guildford-vue-pdfs &&
      mc anonymous set download local/guildford-vue-pdfs &&
      echo 'minio bucket guildford-vue-pdfs ready'
      "

volumes:
  postgres_data:
  minio_data:
